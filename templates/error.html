<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - LogRadarAI</title>
    <!-- local copy of fontawesome -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .error-container {
            text-align: center;
            padding: 3rem;
            max-width: 600px;
        }
        .error-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            color: {{ icon_color | default('#dc3545') }};
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .error-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #fff;
        }
        .error-message {
            font-size: 1.1rem;
            color: #adb5bd;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-details {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }
        .error-details h4 {
            color: #ffc107;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .error-details ul {
            list-style: none;
            color: #e9ecef;
        }
        .error-details li {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .error-details li:last-child {
            border-bottom: none;
        }
        .error-details code {
            background: rgba(0,0,0,0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #00ff00;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 8px;
            text-decoration: none;
            margin: 0.5rem;
            transition: all 0.3s;
            cursor: pointer;
        }
        .btn-primary {
            background: #0066cc;
            color: #fff;
            border: none;
        }
        .btn-primary:hover {
            background: #0052a3;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .btn-outline:hover {
            border-color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
        .status-badge.offline {
            background: rgba(220, 53, 69, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-icon">
        <i class="fas fa-{{ icon | default('exclamation-triangle') }}"></i>
    </div>
    
    <h1 class="error-title">{{ title }}</h1>
    
    <p class="error-message">{{ message }}</p>
    
    {% if details %}
    <div class="error-details">
        <h4><i class="fas fa-wrench"></i> {{ details_title | default('How to fix this') }}</h4>
        <ul>
            {% for detail in details %}
            <li>{{ detail | safe }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
    
    {% if error_code %}
    <div class="status-badge offline">
        <i class="fas fa-bug"></i> Error: {{ error_code }}
    </div>
    {% endif %}
    
    <div style="margin-top: 2rem;">
        <button onclick="location.reload()" class="btn btn-primary">
            <i class="fas fa-sync"></i> Retry
        </button>
        {% if show_home_link %}
        <a href="/" class="btn btn-outline">
            <i class="fas fa-home"></i> Home
        </a>
        {% endif %}
    </div>
</div>
</body>
</html>
